name: Calculator checks
on:
  push:
    branches: [main, master, stage]
  pull_request:
    branches: [main, master, stage]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m ruff check . && python -m ruff format --check .
      - run: python -m mypy
      - name: Run unit and AppTest cases with branch coverage
        run: python -m coverage run -m pytest -m 'not e2e' --junitxml=test-results/unit.xml
      - name: Require at least 99 percent of lines and branches
        run: |
          python -m coverage report
          python -m coverage json
          python -m coverage html
          python - <<'PY'
          import json
          from pathlib import Path

          totals = json.loads(Path("test-results/coverage.json").read_text())["totals"]
          for label, covered, total in [
              ("Lines", totals["covered_lines"], totals["num_statements"]),
              ("Branches", totals["covered_branches"], totals["num_branches"]),
          ]:
              print(f"{label}: {covered}/{total} ({100 * covered / total:.2f}%)")
              if 100 * covered < 99 * total:
                  raise SystemExit(f"{label} coverage is below 99%")
          PY
      - run: python -m playwright install --with-deps chromium
      - name: Start Streamlit and wait for health endpoint
        run: |
          python -m streamlit run app.py --server.address 127.0.0.1 --server.port 8502 --server.headless true > /tmp/streamlit.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8502/_stcore/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/streamlit.log
          exit 1
      - run: python -m pytest -m e2e --run-e2e --app-url http://127.0.0.1:8502 --tracing retain-on-failure --screenshot only-on-failure --junitxml=test-results/e2e.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: test-results/
