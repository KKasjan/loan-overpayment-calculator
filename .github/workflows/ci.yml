name: Calculator checks
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m ruff check . && python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest -m 'not e2e' --junitxml=test-results/unit.xml
      - run: python -m playwright install --with-deps chromium
      - name: Start Streamlit and wait for health endpoint
        run: |
          python -m streamlit run app.py --server.address 127.0.0.1 --server.port 8502 --server.headless true > /tmp/streamlit.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8502/_stcore/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/streamlit.log
          exit 1
      - run: python -m pytest -m e2e --run-e2e --app-url http://127.0.0.1:8502 --tracing retain-on-failure --screenshot only-on-failure --junitxml=test-results/e2e.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: test-results/
