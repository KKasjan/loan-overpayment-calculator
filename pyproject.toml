[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [".venv", ".venv-1", ".agents"]

[tool.mypy]
python_version = "3.12"
files = ["src", "app.py", "tests"]
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: browser tests requiring a running Streamlit server and --run-e2e"]
